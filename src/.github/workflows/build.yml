name: Build ExcelCompare

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pandas openpyxl xlrd pyinstaller
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name ExcelCompare src/compare_excel.py
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: ExcelCompare
        path: dist/ExcelCompare.exe
